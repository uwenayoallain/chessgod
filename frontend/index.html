<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#21201d" />
    <!-- Applies the stored theme before the first paint. The stylesheet's
         default is dark and React set the class only after it had loaded, so a
         light-theme player saw a dark page flash on every load. Kept in step
         with theme-provider.tsx: same storage key, same class, same colours.
         Classic and inline so it runs before anything renders; every access is
         guarded because storage can throw when site data is blocked. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          var stored = window.localStorage.getItem('chessgod-theme')
          if (stored === 'dark' || stored === 'light') theme = stored
        } catch (error) {}
        var resolved = theme
        if (theme === 'system') {
          resolved = 'dark'
          try {
            if (!window.matchMedia('(prefers-color-scheme: dark)').matches) resolved = 'light'
          } catch (error) {}
        }
        var root = document.documentElement
        root.classList.add(resolved)
        root.style.colorScheme = resolved
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', resolved === 'light' ? '#edebe9' : '#21201d')
      })()
    </script>
    <meta
      name="description"
      content="Import your Chess.com games, find the moves you keep getting wrong, and drill them."
    />
    <!-- Served locally: the Google Fonts stylesheet blocked first paint for ~1s. -->
    <link
      rel="preload"
      href="/fonts/montserrat-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>ChessGod</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
